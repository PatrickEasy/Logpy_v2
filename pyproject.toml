[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpy"
version = "2.2.0"
description = "Small Python utilities library: timestamped logging, flexible timers, coloured CLI helpers, file-format conversion, and a project scaffolder"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Patrick Easy"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "logging",
    "timestamp",
    "json",
    "timer",
    "utilities",
    "cli",
    "convert",
    "scaffold",
]

# Runtime dependencies. The logging / timing / print-utils / scaffold
# modules use only the standard library; the ``convert`` module needs
# these three packages.
dependencies = [
    "markdown>=3.4",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
# Install the package and you get these on your PATH:
logpy-convert = "Logpy.convert:cli"
logpy-scaffold = "Logpy.scaffold:main"

[project.urls]
Homepage = "https://github.com/PatrickEasy/Logpy_v2"
Repository = "https://github.com/PatrickEasy/Logpy_v2"
Issues = "https://github.com/PatrickEasy/Logpy_v2/issues"

[tool.setuptools.packages.find]
include = ["Logpy*"]
