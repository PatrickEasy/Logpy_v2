[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpy"
version = "2.0.0"
description = "Simple logging utilities for Python projects with timestamped output and JSON file logging"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Patrick Easy"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["logging", "timestamp", "json", "utilities"]

[project.urls]
Homepage = "https://github.com/PatrickEasy/Logpy_v2"
Repository = "https://github.com/PatrickEasy/Logpy_v2"
Issues = "https://github.com/PatrickEasy/Logpy_v2/issues"

[tool.setuptools.packages.find]
include = ["Logpy*"]
